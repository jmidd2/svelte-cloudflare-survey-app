name = "feedback-system"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2025-06-12"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
version_metadata = { binding = "CF_VERSION_METADATA" }
upload_source_maps = true

[observability.logs]
enabled = true

[assets]
directory = "./public/"
binding = "ASSETS"
# Route configuration (uncomment and modify when ready for production)
# routes = [
#   { pattern = "yourdomain.com/*", zone_name = "yourdomain.com" }
# ]

# Environment variables visible to client and server code
[vars]
#ENVIRONMENT = "development"
#APP_URL = "http://localhost:8788"
AUTH_MAX_AGE = 86400
EMAIL_FROM = "noreply@jmidd.dev"

# Optional: Separate database for tenant management (if using multi-database approach)
[[d1_databases]]
binding = "DB"
database_name = "tenant-mgmt-db"
database_id = "a16927fc-e16f-4ae4-8480-c613439c46e1"
migrations_dir = "./db/migrations"

# Analytics Engine Configuration
[[analytics_engine_datasets]]
binding = "ANALYTICS" # This is how you'll reference it in your code
dataset = "analytics"

# KV Namespace for caching (optional but recommended)
[[kv_namespaces]]
binding = "CACHE"
id = "2843031524a84ca2b6d879c17ca94a5e"

[env.staging]
name = "feedback-system-staging"

[env.production]
name = "feedback-system-production"
# Development environment specific settings
#[env.dev]
## Development-specific variables
##vars = { ENVIRONMENT = "development", APP_URL = "http://localhost:8788", DATABASE_URL = "" }
#vars = { ENVIRONMENT = "development" }
#
## Production environment specific settings
#[env.production]
## Production-specific variables
##vars = { ENVIRONMENT = "production", APP_URL = "https://yourdomain.com", DATABASE_URL = "" }
#vars = { ENVIRONMENT = "production" }
#
## Staging environment specific settings
#[env.staging]
## Staging-specific variables
##vars = { ENVIRONMENT = "staging", APP_URL = "https://staging.yourdomain.com", DATABASE_URL = "" }
#vars = { ENVIRONMENT = "staging" }


# Secrets: Set these using 'wrangler secret put <NAME>'
# Required secrets:
# - AUTH0_CLIENT_ID
# - AUTH0_CLIENT_SECRET
# - AUTH_SECRET