name = "feedback-system"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2025-06-12"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
version_metadata = { binding = "CF_VERSION_METADATA" }
upload_source_maps = true

# jonathan.middleton@travisspark.com's CF account
account_id = "55e973a30de739096f0791126a25839c"

[observability.logs]
enabled = true

[assets]
directory = "./public/"
binding = "ASSETS"

# Environment variables visible to client and server code
[vars]
#ENVIRONMENT = "development"
#APP_URL = "http://localhost:8788"
AUTH_MAX_AGE = 86400
EMAIL_FROM = "noreply@jmidd.dev"
NODE_ENV = "dev"

# Optional: Separate database for tenant management (if using multi-database approach)
[[d1_databases]]
binding = "DB"
database_name = "tenant-mgmt-db"
database_id = "a16927fc-e16f-4ae4-8480-c613439c46e1"
migrations_dir = "./db/migrations"

# Analytics Engine Configuration
[[analytics_engine_datasets]]
binding = "ANALYTICS" # This is how you'll reference it in your code
dataset = "analytics"

# KV Namespace for caching (optional but recommended)
[[kv_namespaces]]
binding = "CACHE"
id = "2843031524a84ca2b6d879c17ca94a5e"

[env.staging]
    # phoenix@travisspark.com's CF account
    account_id = "d407438686c7c34424056b8a87db47c5"
    name = "feedback-app-staging"
    routes = [
        { pattern = "staging.feedback.travisspark.com/*", zone_name = "travisspark.com" }
    ]

    version_metadata = { binding = "CF_VERSION_METADATA" }

    [env.staging.vars]
    AUTH_MAX_AGE = 86400
    EMAIL_FROM = "noreply@jmidd.dev"
    NODE_ENV = "staging"

    [[env.staging.d1_databases]]
    binding = "DB"
    database_name = "staging-feedback-app"
    migrations_dir = "./db/migrations"
    database_id = "033a442a-0750-4887-ab3b-ae9f249287c7"

    # Analytics Engine Configuration
    [[env.staging.analytics_engine_datasets]]
    binding = "ANALYTICS" # This is how you'll reference it in your code
    dataset = "staging-feedback-analytics"

    # KV Namespace for caching (optional but recommended)
    [[env.staging.kv_namespaces]]
    binding = "CACHE"
    id = "d40c03d06a894cc19d67443c331c79a0"

[env.production]
    # phoenix@travisspark.com's CF account
    account_id = "d407438686c7c34424056b8a87db47c5"
    name = "feedback-app-prod"
    routes = [
        { pattern = "feedback.travisspark.com/*", zone_name = "travisspark.com" }
    ]

    version_metadata = { binding = "CF_VERSION_METADATA" }
    [env.production.vars]
    AUTH_MAX_AGE = 86400
    EMAIL_FROM = "noreply@jmidd.dev"
    NODE_ENV = "production"

    [[env.production.d1_databases]]
    binding = "DB"
    database_name = "prod-feedback-app"
    migrations_dir = "./db/migrations"
    database_id = "0403f210-43f1-4c81-a903-0b2f4d5d7ae3"

    # Analytics Engine Configuration
    [[env.production.analytics_engine_datasets]]
    binding = "ANALYTICS" # This is how you'll reference it in your code
    dataset = "prod-feedback-analytics"

    # KV Namespace for caching (optional but recommended)
    [[env.production.kv_namespaces]]
    binding = "CACHE"
    id = "ee0feef839614e6e92030f1954847386"